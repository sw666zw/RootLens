global:
  scrape_interval: 5s

scrape_configs:
  - job_name: inventory-service
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:8000
        labels:
          service: inventory

  - job_name: order-service
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:8001
        labels:
          service: order

  - job_name: diagnosis-service
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:8002
        labels:
          service: diagnosis
