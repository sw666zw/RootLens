services:
  postgres:
    image: postgres:17-alpine
    container_name: rootlens-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rootlens_inventory}
      POSTGRES_USER: ${POSTGRES_USER:-rootlens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rootlens_dev_password}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - rootlens

  prometheus:
    image: prom/prometheus:v3.12.0
    container_name: rootlens-prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - rootlens

  loki:
    image: grafana/loki:3.7.0
    container_name: rootlens-loki
    command:
      - -config.file=/etc/loki/loki.yml
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./observability/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki
    restart: unless-stopped
    networks:
      - rootlens

  alloy:
    image: grafana/alloy:v1.18.0
    container_name: rootlens-alloy
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    ports:
      - "127.0.0.1:12345:12345"
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - ./runtime/logs:/var/log/rootlens:ro
      - alloy_data:/var/lib/alloy/data
    depends_on:
      - loki
    restart: unless-stopped
    networks:
      - rootlens

  grafana:
    image: grafana/grafana:12.4.3
    container_name: rootlens-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-rootlens_local_only}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki
      - jaeger
    restart: unless-stopped
    networks:
      - rootlens

  jaeger:
    image: jaegertracing/jaeger:2.20.0
    container_name: rootlens-jaeger
    ports:
      - "127.0.0.1:16686:16686"
    expose:
      - "4317"
      - "4318"
    restart: unless-stopped
    networks:
      - rootlens

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.156.0
    container_name: rootlens-otel-collector
    command:
      - --config=/etc/otelcol-contrib/collector.yml
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:13133:13133"
    volumes:
      - ./observability/opentelemetry/collector.yml:/etc/otelcol-contrib/collector.yml:ro
    depends_on:
      - jaeger
    restart: unless-stopped
    networks:
      - rootlens

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
  loki_data:
  alloy_data:

networks:
  rootlens:
