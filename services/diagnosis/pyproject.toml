[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "rootlens-diagnosis-service"
version = "0.1.0"
description = "Local-development API for RootLens deterministic diagnosis"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "httpx>=0.27,<1.0",
    "opentelemetry-api>=1.39,<2.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.39,<2.0",
    "opentelemetry-instrumentation-fastapi>=0.60b0,<1.0",
    "opentelemetry-instrumentation-httpx>=0.60b0,<1.0",
    "opentelemetry-sdk>=1.39,<2.0",
    "prometheus-client>=0.21,<1.0",
    "rootlens-diagnosis-engine==0.1.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "ruff==0.15.22",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --import-mode=importlib"
asyncio_mode = "auto"
pythonpath = ["src", "../../tools/diagnosis_engine/src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
